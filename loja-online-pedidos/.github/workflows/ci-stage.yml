name: CD Stage
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t order-system:latest .

      - name: Deploy to Stage
        run: |
          docker-compose -f docker/docker-compose.stage.yml up -d